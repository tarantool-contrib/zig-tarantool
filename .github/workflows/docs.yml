name: Documentation

# Builds the documentation for every change to its sources: the guides (doc/,
# mkdocs.yml), in each language, and the API reference that `zig build docs`
# generates from the doc comments of src/. --strict fails on a broken link or
# anchor, and on a page the nav omits. Then warns about Russian pages
# (*.ru.md) that lag behind their English ones.
#
# A push to master publishes the version `master`; a tag v1.2.0 publishes
# `1.2.0`, aliased `latest` if it is the highest release. A push to a branch
# doc/v1.2.0, branched off the tag by hand, publishes `1.2.0` again: the way to
# fix the documentation of a release. ci/docs.py commits them
# to the gh-pages branch, in /<lang>/<version>/ and /api/<version>/ (see its
# header), which GitHub Pages serves: Settings > Pages > Source "Deploy from a
# branch", gh-pages, / (root).

on:
  push:
    branches: [master, 'doc/v*']
    tags: ['v*']
    paths:
      - 'doc/**'
      - 'mkdocs.yml'
      - 'src/**'
      - 'build.zig'
      - 'ci/docs.py'
      - 'ci/doc_translations.py'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'doc/**'
      - 'mkdocs.yml'
      - 'src/**'
      - 'build.zig'
      - 'ci/docs.py'
      - 'ci/doc_translations.py'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

env:
  ZIG_VERSION: 0.17.1

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NO_MKDOCS_2_WARNING: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The whole history: the check of the translations compares when a
          # page and its translation last changed.
          fetch-depth: 0

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ env.ZIG_VERSION }}

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install the tools
        run: python3 -m pip install -r doc/requirements.txt

      # The API reference, then each language with mkdocs build --strict, into
      # site/ in the published layout.
      - name: Build the site
        run: python3 ci/docs.py build

      # Warns about a translation whose English page changed after it or is
      # gone; does not fail the build.
      - name: Check the translations
        run: python3 ci/doc_translations.py

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: site/
          retention-days: 7

  deploy:
    if: >-
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v') ||
       startsWith(github.ref, 'refs/heads/doc/v'))
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write # push to gh-pages
    # One publication at a time: each one commits on top of the last.
    concurrency:
      group: docs-deploy
      cancel-in-progress: false
    env:
      NO_MKDOCS_2_WARNING: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ env.ZIG_VERSION }}

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install the tools
        run: python3 -m pip install -r doc/requirements.txt

      - name: Publish to gh-pages
        env:
          REF: ${{ github.ref_name }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python3 ci/docs.py deploy "$REF" --push
